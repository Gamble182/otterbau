<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sony Dynamicron T-120 inspired gradients -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdb863;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#f4914d;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#e85a2b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c73e1d;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f5f1e8;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b2635;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5d1a2b;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="shadowGradient" cx="50%" cy="90%" r="60%">
      <stop offset="0%" style="stop-color:#2a1b1b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2a1b1b;stop-opacity:0" />
    </radialGradient>
    
    <!-- Icon shadow filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2a1b1b" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- iOS-style rounded background -->
  <rect width="192" height="192" rx="42" ry="42" fill="url(#backgroundGradient)" />
  
  <!-- Subtle background pattern -->
  <circle cx="50" cy="50" r="80" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1" />
  <circle cx="140" cy="140" r="60" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08" />
  
  <!-- Shadow base -->
  <ellipse cx="96" cy="165" rx="45" ry="12" fill="url(#shadowGradient)" />
  
  <!-- Main house structure -->
  <g transform="translate(96, 96)" filter="url(#iconShadow)">
    
    <!-- House base -->
    <rect x="-32" y="-8" width="64" height="48" rx="4" ry="4" fill="url(#houseGradient)" stroke="#e85a2b" stroke-width="1.5" />
    
    <!-- Roof -->
    <path d="M -40 -8 L 0 -35 L 40 -8 Z" fill="url(#roofGradient)" stroke="#5d1a2b" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Chimney -->
    <rect x="20" y="-28" width="8" height="16" rx="1" ry="1" fill="#8b2635" stroke="#5d1a2b" stroke-width="1" />
    
    <!-- Door -->
    <rect x="-8" y="15" width="16" height="25" rx="8" ry="8" fill="#c73e1d" stroke="#8b2635" stroke-width="1.5" />
    <circle cx="4" cy="27" r="1.5" fill="#fdb863" />
    
    <!-- Windows -->
    <rect x="-25" y="5" width="12" height="12" rx="2" ry="2" fill="#87ceeb" stroke="#5d1a2b" stroke-width="1" opacity="0.9" />
    <rect x="13" y="5" width="12" height="12" rx="2" ry="2" fill="#87ceeb" stroke="#5d1a2b" stroke-width="1" opacity="0.9" />
    
    <!-- Window cross frames -->
    <line x1="-19" y1="5" x2="-19" y2="17" stroke="#5d1a2b" stroke-width="1" />
    <line x1="-25" y1="11" x2="-13" y2="11" stroke="#5d1a2b" stroke-width="1" />
    <line x1="19" y1="5" x2="19" y2="17" stroke="#5d1a2b" stroke-width="1" />
    <line x1="13" y1="11" x2="25" y2="11" stroke="#5d1a2b" stroke-width="1" />
    
  </g>
  
  <!-- Tracking/Chart elements -->
  <g transform="translate(96, 96)" opacity="0.85">
    
    <!-- Clock icon (für Arbeitszeit) -->
    <g transform="translate(-50, 25)">
      <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#e85a2b" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="-5" stroke="#e85a2b" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="0" x2="3" y2="0" stroke="#e85a2b" stroke-width="1.5" stroke-linecap="round" />
    </g>
    
    <!-- Money/Euro icon (für Ausgaben) -->
    <g transform="translate(50, 25)">
      <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#e85a2b" stroke-width="1.5" />
      <text x="0" y="3" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#e85a2b" text-anchor="middle">€</text>
    </g>
    
    <!-- Progress bar (für Projektfortschritt) -->
    <g transform="translate(0, 50)">
      <rect x="-25" y="-2" width="50" height="4" rx="2" ry="2" fill="#ffffff" stroke="#e85a2b" stroke-width="1" />
      <rect x="-25" y="-2" width="32" height="4" rx="2" ry="2" fill="#e85a2b" />
    </g>
    
  </g>
  
  <!-- iOS-style highlight -->
  <rect width="192" height="192" rx="42" ry="42" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <path d="M 42 8 Q 8 8 8 42 L 8 80 Q 8 50 42 50 L 150 50 Q 180 50 180 80 L 180 42 Q 180 8 146 8 Z" fill="rgba(255,255,255,0.15)" />
  
</svg>